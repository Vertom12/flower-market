<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Comptoir Fleuri — Commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23291f;
    --kraft:#e4d9bd;
    --kraft-light:#f3ead2;
    --paper:#faf6ea;
    --forest:#33503f;
    --forest-dark:#203327;
    --berry:#7c3b4d;
    --gold:#b8862f;
    --line: rgba(35,41,31,0.18);
    --shadow: rgba(35,41,31,0.16);
    --radius-tag: 3px;
    --font-display: "Fraunces", serif;
    --font-body: "Work Sans", sans-serif;
    --font-mono: "Space Mono", monospace;
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--kraft);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; margin:0; line-height:1.15; }
  p{ margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; font-size:1rem; }
  a{ color:inherit; }

  :focus-visible{
    outline: 2px solid var(--berry);
    outline-offset: 2px;
  }

  #app{ max-width:1080px; margin:0 auto; padding:0 20px 80px; }

  /* ---------- Header ---------- */
  .site-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    padding:36px 0 28px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand svg{ flex-shrink:0; }
  .brand-name{ font-size:1.65rem; letter-spacing:0.2px; }
  .brand-tagline{
    font-family:var(--font-body);
    font-size:0.92rem;
    color:var(--forest-dark);
    margin-top:4px;
    max-width:38ch;
  }
  .info-stub{
    background:var(--paper);
    border:1px solid var(--line);
    padding:12px 18px;
    font-size:0.85rem;
    transform:rotate(1deg);
    box-shadow: 2px 3px 0 var(--shadow);
    line-height:1.6;
  }
  .info-stub strong{ font-family:var(--font-display); font-weight:600; display:block; margin-bottom:2px; }

  /* ---------- Category tab ---------- */
  .category-block{ margin-top:38px; }
  .category-tab{
    display:inline-block;
    background:var(--forest);
    color:var(--paper);
    font-family:var(--font-display);
    font-size:1.05rem;
    padding:6px 22px 6px 16px;
    clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%);
    margin-bottom:16px;
  }

  /* ---------- Catalog grid ---------- */
  .catalog-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap:20px;
  }
  .product-card{
    position:relative;
    background:var(--kraft-light);
    border:1px solid var(--line);
    padding:18px 16px 16px;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    box-shadow: 3px 4px 0 var(--shadow);
  }
  .product-card::before{
    content:"";
    position:absolute;
    top:12px; left:12px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--kraft);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
  }
  .product-card:nth-child(3n){ transform:rotate(-0.6deg); }
  .product-card:nth-child(3n+1){ transform:rotate(0.5deg); }
  .product-card:nth-child(3n+2){ transform:rotate(-0.2deg); }

  .product-name{ font-size:1.05rem; margin:14px 0 6px; padding-left:2px; }
  .product-desc{ font-size:0.85rem; color:var(--forest-dark); margin-bottom:14px; padding-left:2px; min-height:2.6em; }
  .product-footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .price-tag{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:0.85rem;
    background:var(--gold);
    color:var(--paper);
    padding:4px 9px;
    border-radius:50px;
  }
  .btn{
    border:none;
    font-weight:600;
    font-size:0.85rem;
    padding:9px 16px;
    background:var(--forest);
    color:var(--paper);
    transition: transform 0.15s ease;
  }
  .btn:hover{ background:var(--forest-dark); }
  .btn-berry{ background:var(--berry); }
  .btn-berry:hover{ background:#5e2c3a; }
  .btn:disabled{ opacity:0.55; cursor:not-allowed; }
  .btn-ghost{
    background:transparent;
    color:var(--forest-dark);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{ background:var(--kraft); }

  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:28px; height:28px;
    border:1px solid var(--forest);
    background:var(--paper);
    color:var(--forest-dark);
    font-size:1rem;
    line-height:1;
  }
  .stepper button:hover{ background:var(--forest); color:var(--paper); }
  .stepper .qty{ font-family:var(--font-mono); min-width:1.4ch; text-align:center; }

  @media (prefers-reduced-motion: no-preference){
    .product-card{ transition: transform 0.2s ease; }
    .product-card:hover{ transform: translateY(-3px) rotate(0deg); }
  }

  /* ---------- Cart button + drawer ---------- */
  #cart-toggle{
    position:fixed;
    right:22px; bottom:22px;
    background:var(--berry);
    color:var(--paper);
    border:none;
    padding:14px 20px;
    font-weight:600;
    font-size:0.95rem;
    box-shadow: 3px 4px 0 rgba(0,0,0,0.25);
    z-index:40;
    display:flex;
    align-items:center;
    gap:10px;
  }
  #cart-toggle .badge{
    background:var(--paper);
    color:var(--berry);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:0.8rem;
    min-width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }

  #cart-scrim{
    position:fixed; inset:0;
    background:rgba(20,22,16,0.35);
    z-index:45;
    opacity:0; pointer-events:none;
  }
  #cart-scrim.open{ opacity:1; pointer-events:auto; }

  #cart-drawer{
    position:fixed;
    top:0; right:0; bottom:0;
    width:min(380px, 100%);
    background:var(--paper);
    border-left:1px dashed var(--line);
    z-index:50;
    display:flex; flex-direction:column;
    transform: translateX(100%);
    padding:22px 20px;
    overflow-y:auto;
  }
  #cart-drawer.open{ transform: translateX(0); }
  @media (prefers-reduced-motion: no-preference){
    #cart-drawer{ transition: transform 0.28s ease; }
    #cart-scrim{ transition: opacity 0.28s ease; }
  }
  @media (max-width: 640px){
    #cart-drawer{
      top:auto; left:0; right:0; width:auto;
      max-height:82vh;
      border-left:none;
      border-top:1px dashed var(--line);
      transform: translateY(100%);
    }
    #cart-drawer.open{ transform: translateY(0); }
  }

  .drawer-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .receipt-line{
    display:flex; justify-content:space-between; gap:10px;
    font-family:var(--font-mono);
    font-size:0.85rem;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
  }
  .receipt-line .item-name{ font-family:var(--font-body); font-size:0.9rem; }
  .receipt-total{
    display:flex; justify-content:space-between;
    font-size:1.1rem; font-weight:600;
    margin-top:14px; padding-top:14px;
    border-top:2px solid var(--ink);
  }
  .remove-link{ background:none; border:none; color:var(--berry); font-size:0.78rem; text-decoration:underline; padding:0; margin-top:2px; }

  /* ---------- Forms ---------- */
  .view-section{ padding:30px 0 10px; max-width:520px; }
  .back-link{ display:inline-block; margin-bottom:22px; font-size:0.88rem; color:var(--forest-dark); text-decoration:underline; background:none; border:none; padding:0; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.88rem; font-weight:500; margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--forest);
    background:var(--kraft-light);
    color:var(--ink);
  }
  .field textarea{ min-height:80px; resize:vertical; }
  .field-hint{ font-size:0.78rem; color:var(--forest-dark); margin-top:4px; }
  .form-error{ background:#f4dede; border:1px solid var(--berry); color:var(--berry); padding:10px 14px; font-size:0.88rem; margin-bottom:18px; }

  /* ---------- Confirmation ---------- */
  .ticket{
    background:var(--paper);
    border:1px dashed var(--ink);
    padding:28px 24px;
    max-width:440px;
  }
  .ticket-number{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:1.8rem;
    color:var(--berry);
    display:inline-block;
    margin:10px 0 18px;
  }
  .ticket dl{ display:grid; grid-template-columns: auto 1fr; gap:6px 14px; font-size:0.9rem; margin:16px 0; }
  .ticket dt{ color:var(--forest-dark); }
  .ticket dd{ margin:0; }

  /* ---------- Admin ---------- */
  .admin-table{ width:100%; border-collapse:collapse; margin-top:20px; font-size:0.88rem; }
  .admin-table th, .admin-table td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .admin-table th{ font-family:var(--font-body); font-weight:600; }
  .status-select{ padding:5px 8px; border:1px solid var(--forest); background:var(--kraft-light); }
  .filter-row{ display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .filter-row button{ padding:6px 14px; font-size:0.82rem; border:1px solid var(--forest); background:transparent; color:var(--forest-dark); }
  .filter-row button.active{ background:var(--forest); color:var(--paper); }
  .empty-state{ padding:30px 0; color:var(--forest-dark); font-size:0.92rem; max-width:44ch; }

  /* ---------- Footer ---------- */
  .site-footer{
    margin-top:64px;
    padding-top:22px;
    border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px;
    font-size:0.8rem;
    color:var(--forest-dark);
  }
  .site-footer button{ background:none; border:none; color:var(--forest-dark); text-decoration:underline; font-size:0.8rem; padding:0; }
</style>
</head>
<body>
<div id="app">
  <header class="site-header">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
        <g stroke="#33503f" stroke-width="1.6">
          <circle cx="21" cy="21" r="4" fill="#b8862f" stroke="none"/>
          <path d="M21 17 C17 13, 17 7, 21 5 C25 7, 25 13, 21 17Z" fill="#33503f"/>
          <path d="M25 21 C29 17, 35 17, 37 21 C35 25, 29 25, 25 21Z" fill="#33503f"/>
          <path d="M21 25 C25 29, 25 35, 21 37 C17 35, 17 29, 21 25Z" fill="#33503f"/>
          <path d="M17 21 C13 17, 7 17, 5 21 C7 25, 13 25, 17 21Z" fill="#33503f"/>
        </g>
      </svg>
      <div>
        <h1 class="brand-name">Le Comptoir Fleuri</h1>
        <p class="brand-tagline">Bouquets, compositions et plantes préparés le matin même, à récupérer en boutique.</p>
      </div>
    </div>
    <div class="info-stub">
      <strong>Retrait en boutique</strong>
      12 rue des Lilas, Strasbourg<br>
      Mar–sam 9h–19h · dim 9h–13h<br>
      Fermé le lundi
    </div>
  </header>

  <main id="view-root"></main>

  <footer class="site-footer">
    <span>© Le Comptoir Fleuri — commande en ligne, retrait en boutique.</span>
    <button type="button" data-action="goto-admin">Espace commerçant</button>
  </footer>
</div>

<div id="cart-scrim" data-action="close-cart"></div>
<aside id="cart-drawer" aria-label="Panier"></aside>
<button id="cart-toggle" type="button" data-action="open-cart" aria-label="Ouvrir le panier">
  <span>Panier</span>
  <span class="badge" id="cart-badge">0</span>
</button>

<script>
(function(){
"use strict";

/* ---------------- Data ---------------- */
var PRODUCTS = [
  { id:"bq-eclat", category:"Bouquets", name:"Bouquet Éclat de Saison", desc:"Fleurs fraîches du moment, coupées le matin même.", price:28 },
  { id:"bq-champetre", category:"Bouquets", name:"Bouquet Champêtre", desc:"Tons pastel, fleurs des champs et graminées.", price:24 },
  { id:"bq-blanc", category:"Bouquets", name:"Bouquet Blanc Pur", desc:"Roses et lys blancs, élégance simple.", price:32 },
  { id:"bq-soleil", category:"Bouquets", name:"Bouquet Soleil", desc:"Tournesols et gerberas, couleurs vives.", price:22 },
  { id:"cp-vase", category:"Compositions", name:"Composition Vase Rond", desc:"Arrangement bas, idéal pour une table.", price:35 },
  { id:"cp-corbeille", category:"Compositions", name:"Corbeille Jardin", desc:"Panier fleuri façon jardin anglais.", price:40 },
  { id:"cp-duo", category:"Compositions", name:"Duo de Roses", desc:"Roses rouges en coffret, pour offrir.", price:30 },
  { id:"pl-orchidee", category:"Plantes", name:"Orchidée Phalaenopsis", desc:"En pot céramique, entretien facile.", price:26 },
  { id:"pl-pothos", category:"Plantes", name:"Pothos Doré", desc:"Plante d'intérieur robuste et grimpante.", price:15 },
  { id:"pl-ficus", category:"Plantes", name:"Ficus Lyrata", desc:"Grande plante au feuillage sculptural.", price:45 }
];
var CATEGORIES = ["Bouquets", "Compositions", "Plantes"];
var ADMIN_CODE = "1234"; // Simple gate, pas une vraie authentification. À changer dans le code.

/* ---------------- State ---------------- */
var state = {
  view: "catalog",
  cart: {},
  cartOpen: false,
  submitting: false,
  submitError: null,
  lastOrder: null,
  admin: { authed:false, loading:false, error:null, orders:[], filter:"tous", loginError:null }
};

/* ---------------- Helpers ---------------- */
function formatPrice(n){
  return n.toLocaleString("fr-FR", { style:"currency", currency:"EUR" });
}
function findProduct(id){
  for (var i=0;i<PRODUCTS.length;i++){ if (PRODUCTS[i].id===id) return PRODUCTS[i]; }
  return null;
}
function cartCount(){
  var total=0;
  for (var id in state.cart){ total += state.cart[id]; }
  return total;
}
function cartLines(){
  var lines=[];
  for (var id in state.cart){
    var qty = state.cart[id];
    if (qty>0){
      var p = findProduct(id);
      if (p) lines.push({ product:p, qty:qty, subtotal:p.price*qty });
    }
  }
  return lines;
}
function cartTotal(){
  return cartLines().reduce(function(sum,l){ return sum+l.subtotal; }, 0);
}
function getTimeSlots(dateStr){
  if (!dateStr) return [];
  var d = new Date(dateStr+"T00:00:00");
  if (isNaN(d.getTime())) return [];
  var day = d.getDay();
  if (day===1) return []; // Lundi : fermé
  var startHour=9, endHour, endMin;
  if (day===0){ endHour=12; endMin=30; } else { endHour=18; endMin=30; }
  var slots=[]; var h=startHour, m=0;
  while (h<endHour || (h===endHour && m<=endMin)){
    slots.push(String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"));
    m+=30; if (m>=60){ m=0; h+=1; }
  }
  return slots;
}
function formatFrenchDate(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function todayIso(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ---------------- Storage ---------------- */
async function loadAllOrders(){
  try{
    var res = await window.storage.get("orders", true);
    if (res && res.value) return JSON.parse(res.value);
    return [];
  } catch(e){
    return []; // clé pas encore créée = aucune commande
  }
}
async function saveAllOrders(orders){
  var res = await window.storage.set("orders", JSON.stringify(orders), true);
  if (!res) throw new Error("save-failed");
  return res;
}

/* ---------------- Rendering ---------------- */
function render(){
  var root = document.getElementById("view-root");
  if (state.view==="catalog") root.innerHTML = renderCatalog();
  else if (state.view==="checkout") root.innerHTML = renderCheckout();
  else if (state.view==="confirmation") root.innerHTML = renderConfirmation();
  else if (state.view==="admin") root.innerHTML = renderAdmin();

  renderCartUI();
  attachDynamicListeners();
}

function renderCatalog(){
  var html = "";
  CATEGORIES.forEach(function(cat){
    html += '<section class="category-block">';
    html += '<span class="category-tab">'+cat+'</span>';
    html += '<div class="catalog-grid">';
    PRODUCTS.filter(function(p){ return p.category===cat; }).forEach(function(p){
      var qty = state.cart[p.id] || 0;
      html += '<article class="product-card">';
      html += '<h3 class="product-name">'+escapeHtml(p.name)+'</h3>';
      html += '<p class="product-desc">'+escapeHtml(p.desc)+'</p>';
      html += '<div class="product-footer">';
      html += '<span class="price-tag">'+formatPrice(p.price)+'</span>';
      if (qty===0){
        html += '<button type="button" class="btn" data-action="add" data-id="'+p.id+'">Ajouter</button>';
      } else {
        html += '<div class="stepper">';
        html += '<button type="button" data-action="dec" data-id="'+p.id+'" aria-label="Retirer un">−</button>';
        html += '<span class="qty">'+qty+'</span>';
        html += '<button type="button" data-action="inc" data-id="'+p.id+'" aria-label="Ajouter un">+</button>';
        html += '</div>';
      }
      html += '</div></article>';
    });
    html += '</div></section>';
  });
  return html;
}

function renderCartUI(){
  document.getElementById("cart-badge").textContent = cartCount();
  var drawer = document.getElementById("cart-drawer");
  var scrim = document.getElementById("cart-scrim");
  var lines = cartLines();
  var html = '<div class="drawer-head"><h3>Votre panier</h3><button type="button" class="btn-ghost btn" data-action="close-cart" aria-label="Fermer le panier">Fermer</button></div>';
  if (lines.length===0){
    html += '<p class="empty-state">Votre panier est vide. Ajoutez un bouquet, une composition ou une plante depuis la boutique.</p>';
  } else {
    lines.forEach(function(l){
      html += '<div class="receipt-line"><span class="item-name">'+l.qty+'× '+escapeHtml(l.product.name)+'<br><button type="button" class="remove-link" data-action="remove" data-id="'+l.product.id+'">retirer</button></span><span>'+formatPrice(l.subtotal)+'</span></div>';
    });
    html += '<div class="receipt-total"><span>Total</span><span>'+formatPrice(cartTotal())+'</span></div>';
    html += '<button type="button" class="btn btn-berry" style="margin-top:20px;width:100%" data-action="goto-checkout">Commander</button>';
  }
  drawer.innerHTML = html;
  drawer.classList.toggle("open", state.cartOpen);
  scrim.classList.toggle("open", state.cartOpen);
}

function renderCheckout(){
  var lines = cartLines();
  if (lines.length===0){
    return '<div class="view-section"><p>Votre panier est vide.</p><button type="button" class="btn" data-action="goto-catalog" style="margin-top:14px">Retour à la boutique</button></div>';
  }
  var html = '<div class="view-section">';
  html += '<button type="button" class="back-link" data-action="goto-catalog">← Retour à la boutique</button>';
  html += '<h2 style="font-size:1.4rem;margin-bottom:18px">Vos coordonnées</h2>';
  if (state.submitError){
    html += '<div class="form-error">'+escapeHtml(state.submitError)+'</div>';
  }
  html += '<form id="checkout-form">';
  html += '<div class="field"><label for="cf-name">Nom complet</label><input id="cf-name" name="name" type="text" required></div>';
  html += '<div class="field"><label for="cf-phone">Téléphone</label><input id="cf-phone" name="phone" type="tel" required placeholder="06 12 34 56 78"></div>';
  html += '<div class="field"><label for="cf-date">Date de retrait</label><input id="cf-date" name="date" type="date" required min="'+todayIso()+'"></div>';
  html += '<div class="field"><label for="cf-time">Heure de retrait</label><select id="cf-time" name="time" required><option value="">Choisissez d\'abord une date</option></select><p class="field-hint" id="cf-time-hint"></p></div>';
  html += '<div class="field"><label for="cf-notes">Note (message pour la carte, préférences...)</label><textarea id="cf-notes" name="notes"></textarea></div>';
  html += '<button type="submit" class="btn btn-berry" '+(state.submitting?'disabled':'')+'>'+(state.submitting?'Envoi…':'Valider la commande')+'</button>';
  html += '</form></div>';
  return html;
}

function renderConfirmation(){
  var o = state.lastOrder;
  if (!o) return '<div class="view-section"><p>Aucune commande récente.</p><button type="button" class="btn" data-action="goto-catalog" style="margin-top:14px">Retour à la boutique</button></div>';
  var html = '<div class="view-section">';
  html += '<div class="ticket">';
  html += '<p style="font-size:0.85rem;color:var(--forest-dark)">Commande enregistrée</p>';
  html += '<div class="ticket-number">'+o.id+'</div>';
  html += '<dl>';
  html += '<dt>Client</dt><dd>'+escapeHtml(o.name)+'</dd>';
  html += '<dt>Retrait</dt><dd>'+formatFrenchDate(o.date)+' à '+o.time.replace(":","h")+'</dd>';
  o.items.forEach(function(it, idx){
    html += '<dt>'+(idx===0?"Articles":"")+'</dt><dd>'+it.qty+'× '+escapeHtml(it.name)+'</dd>';
  });
  html += '<dt>Total</dt><dd>'+formatPrice(o.total)+'</dd>';
  html += '</dl>';
  html += '<p style="font-size:0.85rem;color:var(--forest-dark)">Présentez ce numéro au comptoir lors du retrait.</p>';
  html += '</div>';
  html += '<button type="button" class="btn" style="margin-top:22px" data-action="goto-catalog">Passer une nouvelle commande</button>';
  html += '</div>';
  return html;
}

function renderAdmin(){
  if (!state.admin.authed){
    var html = '<div class="view-section">';
    html += '<button type="button" class="back-link" data-action="goto-catalog">← Retour à la boutique</button>';
    html += '<h2 style="font-size:1.4rem;margin-bottom:18px">Espace commerçant</h2>';
    if (state.admin.loginError){ html += '<div class="form-error">'+escapeHtml(state.admin.loginError)+'</div>'; }
    html += '<form id="admin-login-form">';
    html += '<div class="field"><label for="admin-code">Code d\'accès</label><input id="admin-code" type="password" required></div>';
    html += '<button type="submit" class="btn">Entrer</button>';
    html += '</form></div>';
    return html;
  }

  var orders = state.admin.orders.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
  if (state.admin.filter!=="tous"){
    orders = orders.filter(function(o){ return o.status===state.admin.filter; });
  }

  var html = '<div class="view-section" style="max-width:760px">';
  html += '<button type="button" class="back-link" data-action="goto-catalog">← Retour à la boutique</button>';
  html += '<h2 style="font-size:1.4rem">Commandes reçues</h2>';
  html += '<div class="filter-row">';
  [["tous","Toutes"],["nouveau","Nouvelles"],["pret","Prêtes"],["recupere","Récupérées"]].forEach(function(f){
    html += '<button type="button" data-action="filter-admin" data-filter="'+f[0]+'" class="'+(state.admin.filter===f[0]?"active":"")+'">'+f[1]+'</button>';
  });
  html += '<button type="button" data-action="refresh-admin" style="margin-left:auto">Actualiser</button>';
  html += '</div>';

  if (state.admin.error){ html += '<div class="form-error" style="margin-top:16px">'+escapeHtml(state.admin.error)+'</div>'; }

  if (state.admin.loading){
    html += '<p style="margin-top:20px;color:var(--forest-dark)">Chargement des commandes…</p>';
  } else if (orders.length===0){
    html += '<p class="empty-state">Aucune commande pour l\'instant. Les commandes des clients apparaîtront ici.</p>';
  } else {
    html += '<table class="admin-table"><thead><tr><th>Ticket</th><th>Client</th><th>Retrait</th><th>Articles</th><th>Total</th><th>Statut</th></tr></thead><tbody>';
    orders.forEach(function(o){
      html += '<tr>';
      html += '<td>'+o.id+'</td>';
      html += '<td>'+escapeHtml(o.name)+'<br><span style="color:var(--forest-dark)">'+escapeHtml(o.phone)+'</span></td>';
      html += '<td>'+formatFrenchDate(o.date)+'<br>'+o.time.replace(":","h")+'</td>';
      html += '<td>'+o.items.map(function(it){ return it.qty+'× '+escapeHtml(it.name); }).join("<br>")+(o.notes?'<br><em>"'+escapeHtml(o.notes)+'"</em>':'')+'</td>';
      html += '<td>'+formatPrice(o.total)+'</td>';
      html += '<td><select class="status-select" data-action="set-status" data-id="'+o.id+'">';
      [["nouveau","Nouveau"],["pret","Prêt"],["recupere","Récupéré"]].forEach(function(s){
        html += '<option value="'+s[0]+'" '+(o.status===s[0]?"selected":"")+'>'+s[1]+'</option>';
      });
      html += '</select></td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

/* ---------------- Actions ---------------- */
function setQty(id, qty){
  if (qty<=0) delete state.cart[id]; else state.cart[id]=qty;
  render();
}
function goto(view){
  state.view = view;
  state.submitError = null;
  window.scrollTo({ top:0, behavior:"auto" });
  render();
}

async function submitOrder(formEl){
  var name = formEl.name.value.trim();
  var phone = formEl.phone.value.trim();
  var date = formEl.date.value;
  var time = formEl.time.value;
  var notes = formEl.notes.value.trim();

  if (!name || !phone || !date || !time){
    state.submitError = "Merci de compléter tous les champs obligatoires.";
    render();
    return;
  }

  state.submitting = true; state.submitError = null; render();

  var lines = cartLines();
  var orderDraft = {
    name: name, phone: phone, date: date, time: time, notes: notes,
    items: lines.map(function(l){ return { name:l.product.name, qty:l.qty, price:l.product.price }; }),
    total: cartTotal(),
    status: "nouveau",
    createdAt: Date.now()
  };

  try{
    var existing = await loadAllOrders();
    orderDraft.id = "CF-" + String(existing.length+1).padStart(3,"0");
    existing.push(orderDraft);
    await saveAllOrders(existing);
    state.lastOrder = orderDraft;
    state.cart = {};
    state.cartOpen = false;
    state.view = "confirmation";
  } catch(e){
    state.submitError = "Une erreur est survenue lors de l'enregistrement de votre commande. Merci de réessayer.";
  } finally {
    state.submitting = false;
    render();
  }
}

async function enterAdmin(code){
  if (code !== ADMIN_CODE){
    state.admin.loginError = "Code incorrect.";
    render();
    return;
  }
  state.admin.authed = true;
  state.admin.loginError = null;
  render();
  await refreshAdminOrders();
}
async function refreshAdminOrders(){
  state.admin.loading = true; state.admin.error = null; render();
  state.admin.orders = await loadAllOrders();
  state.admin.loading = false;
  render();
}
async function setOrderStatus(id, status){
  var idx = state.admin.orders.findIndex(function(o){ return o.id===id; });
  if (idx===-1) return;
  var prev = state.admin.orders[idx].status;
  state.admin.orders[idx].status = status;
  render();
  try{
    await saveAllOrders(state.admin.orders);
  } catch(e){
    state.admin.orders[idx].status = prev;
    state.admin.error = "Impossible de mettre à jour ce ticket. Réessayez.";
    render();
  }
}

/* ---------------- Event wiring ---------------- */
document.body.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");

  if (action==="add") setQty(id, (state.cart[id]||0)+1);
  else if (action==="inc") setQty(id, (state.cart[id]||0)+1);
  else if (action==="dec") setQty(id, (state.cart[id]||0)-1);
  else if (action==="remove") setQty(id, 0);
  else if (action==="open-cart"){ state.cartOpen=true; render(); }
  else if (action==="close-cart"){ state.cartOpen=false; render(); }
  else if (action==="goto-checkout"){ state.cartOpen=false; goto("checkout"); }
  else if (action==="goto-catalog") goto("catalog");
  else if (action==="goto-admin") goto("admin");
  else if (action==="refresh-admin") refreshAdminOrders();
  else if (action==="filter-admin"){ state.admin.filter = el.getAttribute("data-filter"); render(); }
});

document.body.addEventListener("submit", function(e){
  if (e.target.id==="checkout-form"){
    e.preventDefault();
    submitOrder(e.target);
  } else if (e.target.id==="admin-login-form"){
    e.preventDefault();
    var code = document.getElementById("admin-code").value;
    enterAdmin(code);
  }
});

document.body.addEventListener("change", function(e){
  if (e.target.getAttribute && e.target.getAttribute("data-action")==="set-status"){
    setOrderStatus(e.target.getAttribute("data-id"), e.target.value);
  }
});

function attachDynamicListeners(){
  var dateInput = document.getElementById("cf-date");
  if (dateInput){
    dateInput.addEventListener("change", function(){
      var timeSelect = document.getElementById("cf-time");
      var hint = document.getElementById("cf-time-hint");
      var slots = getTimeSlots(dateInput.value);
      if (slots.length===0){
        timeSelect.innerHTML = '<option value="">Aucun créneau</option>';
        hint.textContent = "Fermé ce jour-là (le magasin est fermé le lundi). Choisissez une autre date.";
      } else {
        timeSelect.innerHTML = slots.map(function(s){ return '<option value="'+s+'">'+s.replace(":","h")+'</option>'; }).join("");
        hint.textContent = "";
      }
    });
  }
}

/* ---------------- Init ---------------- */
render();
})();
</script>
</body>
</html>
